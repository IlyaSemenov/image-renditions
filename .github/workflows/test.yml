name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    # A release commit only versions a commit whose CI the release has waited for.
    # A skipped job satisfies required status checks, unlike a skipped workflow.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis
        # Wait until Redis is ready before test steps run.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.9

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint package
        run: bun run lint:check

      - name: Build package
        run: bun run build

      - name: Typecheck package
        run: bun run types

      - name: Test package
        env:
          REDIS_URL: redis://localhost:6379
        run: bun run test

      - name: Test Nuxt module
        run: bun run test:nuxt

      - name: Build docs
        run: bun run docs:build
